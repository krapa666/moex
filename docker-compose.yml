name: ${MOEX_COMPOSE_PROJECT:-moex}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VOLUME_SCHEDULE_HOUR: ${VOLUME_SCHEDULE_HOUR:-18}
      VOLUME_SCHEDULE_MINUTE: ${VOLUME_SCHEDULE_MINUTE:-40}
      VOLUME_SCHEDULE_TIMEZONE: ${VOLUME_SCHEDULE_TIMEZONE:-Europe/Moscow}
      VOLUME_BASELINE_SESSIONS: ${VOLUME_BASELINE_SESSIONS:-60}
      VOLUME_DISPLAY_SESSIONS: ${VOLUME_DISPLAY_SESSIONS:-60}
      VOLUME_MIN_BASELINE_SESSIONS: ${VOLUME_MIN_BASELINE_SESSIONS:-60}
      VOLUME_SIGNAL_MIN_RATIO: ${VOLUME_SIGNAL_MIN_RATIO:-3.6}
      VOLUME_SIGNAL_MAX_RATIO: ${VOLUME_SIGNAL_MAX_RATIO:-6.5}
      VOLUME_MOEX_HISTORY_ROWS: ${VOLUME_MOEX_HISTORY_ROWS:-140}
      VOLUME_SMTP_ENABLED: ${VOLUME_SMTP_ENABLED:-false}
      VOLUME_SMTP_HOST: ${VOLUME_SMTP_HOST:-}
      VOLUME_SMTP_PORT: ${VOLUME_SMTP_PORT:-587}
      VOLUME_SMTP_USERNAME: ${VOLUME_SMTP_USERNAME:-}
      VOLUME_SMTP_PASSWORD: ${VOLUME_SMTP_PASSWORD:-}
      VOLUME_SMTP_FROM: ${VOLUME_SMTP_FROM:-}
      VOLUME_SMTP_STARTTLS: ${VOLUME_SMTP_STARTTLS:-true}
      VOLUME_SMTP_SSL: ${VOLUME_SMTP_SSL:-false}
      VOLUME_PUBLIC_BASE_URL: ${VOLUME_PUBLIC_BASE_URL:-https://moex.junnylab.ru}
      MOEX_CCI_ACTUALS_ENABLED: ${MOEX_CCI_ACTUALS_ENABLED:-false}
      MOEX_CCI_USERNAME: ${MOEX_CCI_USERNAME:-}
      MOEX_CCI_PASSWORD: ${MOEX_CCI_PASSWORD:-}
      MOEX_CCI_ACTUALS_SYNC_INTERVAL_HOURS: ${MOEX_CCI_ACTUALS_SYNC_INTERVAL_HOURS:-24}
      MOEX_CCI_ACTUALS_RUN_ON_STARTUP: ${MOEX_CCI_ACTUALS_RUN_ON_STARTUP:-false}
      MOEX_CCI_ACTUALS_YEARS_BACK: ${MOEX_CCI_ACTUALS_YEARS_BACK:-5}
      MOEX_CCI_TIMEOUT_SECONDS: ${MOEX_CCI_TIMEOUT_SECONDS:-30}
      MOEX_CCI_CONCURRENCY: ${MOEX_CCI_CONCURRENCY:-4}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MOEX_BACKEND_BIND:-127.0.0.1}:${MOEX_BACKEND_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  volume-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.volume_worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VOLUME_SCHEDULE_HOUR: ${VOLUME_SCHEDULE_HOUR:-18}
      VOLUME_SCHEDULE_MINUTE: ${VOLUME_SCHEDULE_MINUTE:-40}
      VOLUME_SCHEDULE_TIMEZONE: ${VOLUME_SCHEDULE_TIMEZONE:-Europe/Moscow}
      VOLUME_RUN_ON_STARTUP: ${VOLUME_RUN_ON_STARTUP:-true}
      VOLUME_BASELINE_SESSIONS: ${VOLUME_BASELINE_SESSIONS:-60}
      VOLUME_DISPLAY_SESSIONS: ${VOLUME_DISPLAY_SESSIONS:-60}
      VOLUME_MIN_BASELINE_SESSIONS: ${VOLUME_MIN_BASELINE_SESSIONS:-60}
      VOLUME_SIGNAL_MIN_RATIO: ${VOLUME_SIGNAL_MIN_RATIO:-3.6}
      VOLUME_SIGNAL_MAX_RATIO: ${VOLUME_SIGNAL_MAX_RATIO:-6.5}
      VOLUME_MOEX_TIMEOUT_SECONDS: ${VOLUME_MOEX_TIMEOUT_SECONDS:-20}
      VOLUME_MOEX_CONCURRENCY: ${VOLUME_MOEX_CONCURRENCY:-8}
      VOLUME_MOEX_HISTORY_ROWS: ${VOLUME_MOEX_HISTORY_ROWS:-140}
      VOLUME_SMTP_ENABLED: ${VOLUME_SMTP_ENABLED:-false}
      VOLUME_SMTP_HOST: ${VOLUME_SMTP_HOST:-}
      VOLUME_SMTP_PORT: ${VOLUME_SMTP_PORT:-587}
      VOLUME_SMTP_USERNAME: ${VOLUME_SMTP_USERNAME:-}
      VOLUME_SMTP_PASSWORD: ${VOLUME_SMTP_PASSWORD:-}
      VOLUME_SMTP_FROM: ${VOLUME_SMTP_FROM:-}
      VOLUME_SMTP_STARTTLS: ${VOLUME_SMTP_STARTTLS:-true}
      VOLUME_SMTP_SSL: ${VOLUME_SMTP_SSL:-false}
      VOLUME_PUBLIC_BASE_URL: ${VOLUME_PUBLIC_BASE_URL:-https://moex.junnylab.ru}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  arsagera-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.arsagera_worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ARSAGERA_ANALYST_NAME: ${ARSAGERA_ANALYST_NAME:-Арсагера}
      ARSAGERA_SYNC_INTERVAL_HOURS: ${ARSAGERA_SYNC_INTERVAL_HOURS:-6}
      ARSAGERA_SYNC_CONCURRENCY: ${ARSAGERA_SYNC_CONCURRENCY:-4}
      ARSAGERA_RUN_ON_STARTUP: ${ARSAGERA_RUN_ON_STARTUP:-true}
      FORECAST_SHEETS_SOURCES_JSON: ${FORECAST_SHEETS_SOURCES_JSON:-[]}
      FORECAST_SHEETS_SYNC_INTERVAL_HOURS: ${FORECAST_SHEETS_SYNC_INTERVAL_HOURS:-6}
      FORECAST_SHEETS_SYNC_CONCURRENCY: ${FORECAST_SHEETS_SYNC_CONCURRENCY:-4}
      FORECAST_SHEETS_RUN_ON_STARTUP: ${FORECAST_SHEETS_RUN_ON_STARTUP:-true}
      DOHOD_ENABLED: ${DOHOD_ENABLED:-true}
      DOHOD_ANALYST_NAME: ${DOHOD_ANALYST_NAME:-ДОХОДЪ}
      DOHOD_SYNC_INTERVAL_HOURS: ${DOHOD_SYNC_INTERVAL_HOURS:-6}
      DOHOD_SYNC_CONCURRENCY: ${DOHOD_SYNC_CONCURRENCY:-4}
      DOHOD_RUN_ON_STARTUP: ${DOHOD_RUN_ON_STARTUP:-true}
      DOHOD_TICKER_ALIASES_JSON: ${DOHOD_TICKER_ALIASES_JSON:-}
      FINVISTA_ENABLED: ${FINVISTA_ENABLED:-false}
      FINVISTA_ANALYST_NAME: "${FINVISTA_ANALYST_NAME:-fin-vista (модель)}"
      FINVISTA_SYNC_INTERVAL_HOURS: ${FINVISTA_SYNC_INTERVAL_HOURS:-6}
      FINVISTA_SYNC_CONCURRENCY: ${FINVISTA_SYNC_CONCURRENCY:-4}
      FINVISTA_RUN_ON_STARTUP: ${FINVISTA_RUN_ON_STARTUP:-true}
      FINVISTA_TICKER_ALIASES_JSON: ${FINVISTA_TICKER_ALIASES_JSON:-}
      MOEX_CCI_ACTUALS_ENABLED: ${MOEX_CCI_ACTUALS_ENABLED:-false}
      MOEX_CCI_USERNAME: ${MOEX_CCI_USERNAME:-}
      MOEX_CCI_PASSWORD: ${MOEX_CCI_PASSWORD:-}
      MOEX_CCI_ACTUALS_SYNC_INTERVAL_HOURS: ${MOEX_CCI_ACTUALS_SYNC_INTERVAL_HOURS:-24}
      MOEX_CCI_ACTUALS_RUN_ON_STARTUP: ${MOEX_CCI_ACTUALS_RUN_ON_STARTUP:-false}
      MOEX_CCI_ACTUALS_YEARS_BACK: ${MOEX_CCI_ACTUALS_YEARS_BACK:-5}
      MOEX_CCI_TIMEOUT_SECONDS: ${MOEX_CCI_TIMEOUT_SECONDS:-30}
      MOEX_CCI_CONCURRENCY: ${MOEX_CCI_CONCURRENCY:-4}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  pgbackup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${MOEX_FRONTEND_BIND:-127.0.0.1}:${MOEX_FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:
