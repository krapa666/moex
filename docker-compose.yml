name: ${MOEX_COMPOSE_PROJECT:-moex}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VOLUME_SCHEDULE_HOUR: ${VOLUME_SCHEDULE_HOUR:-18}
      VOLUME_SCHEDULE_MINUTE: ${VOLUME_SCHEDULE_MINUTE:-40}
      VOLUME_SCHEDULE_TIMEZONE: ${VOLUME_SCHEDULE_TIMEZONE:-Europe/Moscow}
      VOLUME_BASELINE_SESSIONS: ${VOLUME_BASELINE_SESSIONS:-60}
      VOLUME_DISPLAY_SESSIONS: ${VOLUME_DISPLAY_SESSIONS:-60}
      VOLUME_MIN_BASELINE_SESSIONS: ${VOLUME_MIN_BASELINE_SESSIONS:-60}
      VOLUME_SIGNAL_MIN_RATIO: ${VOLUME_SIGNAL_MIN_RATIO:-3.6}
      VOLUME_SIGNAL_MAX_RATIO: ${VOLUME_SIGNAL_MAX_RATIO:-6.5}
      VOLUME_MOEX_HISTORY_ROWS: ${VOLUME_MOEX_HISTORY_ROWS:-140}
      VOLUME_SMTP_ENABLED: ${VOLUME_SMTP_ENABLED:-false}
      VOLUME_SMTP_HOST: ${VOLUME_SMTP_HOST:-}
      VOLUME_SMTP_PORT: ${VOLUME_SMTP_PORT:-587}
      VOLUME_SMTP_USERNAME: ${VOLUME_SMTP_USERNAME:-}
      VOLUME_SMTP_PASSWORD: ${VOLUME_SMTP_PASSWORD:-}
      VOLUME_SMTP_FROM: ${VOLUME_SMTP_FROM:-}
      VOLUME_SMTP_STARTTLS: ${VOLUME_SMTP_STARTTLS:-true}
      VOLUME_SMTP_SSL: ${VOLUME_SMTP_SSL:-false}
      VOLUME_PUBLIC_BASE_URL: ${VOLUME_PUBLIC_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MOEX_BACKEND_BIND:-0.0.0.0}:${MOEX_BACKEND_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  volume-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.volume_worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VOLUME_SCHEDULE_HOUR: ${VOLUME_SCHEDULE_HOUR:-18}
      VOLUME_SCHEDULE_MINUTE: ${VOLUME_SCHEDULE_MINUTE:-40}
      VOLUME_SCHEDULE_TIMEZONE: ${VOLUME_SCHEDULE_TIMEZONE:-Europe/Moscow}
      VOLUME_RUN_ON_STARTUP: ${VOLUME_RUN_ON_STARTUP:-true}
      VOLUME_BASELINE_SESSIONS: ${VOLUME_BASELINE_SESSIONS:-60}
      VOLUME_DISPLAY_SESSIONS: ${VOLUME_DISPLAY_SESSIONS:-60}
      VOLUME_MIN_BASELINE_SESSIONS: ${VOLUME_MIN_BASELINE_SESSIONS:-60}
      VOLUME_SIGNAL_MIN_RATIO: ${VOLUME_SIGNAL_MIN_RATIO:-3.6}
      VOLUME_SIGNAL_MAX_RATIO: ${VOLUME_SIGNAL_MAX_RATIO:-6.5}
      VOLUME_MOEX_TIMEOUT_SECONDS: ${VOLUME_MOEX_TIMEOUT_SECONDS:-20}
      VOLUME_MOEX_CONCURRENCY: ${VOLUME_MOEX_CONCURRENCY:-8}
      VOLUME_MOEX_HISTORY_ROWS: ${VOLUME_MOEX_HISTORY_ROWS:-140}
      VOLUME_SMTP_ENABLED: ${VOLUME_SMTP_ENABLED:-false}
      VOLUME_SMTP_HOST: ${VOLUME_SMTP_HOST:-}
      VOLUME_SMTP_PORT: ${VOLUME_SMTP_PORT:-587}
      VOLUME_SMTP_USERNAME: ${VOLUME_SMTP_USERNAME:-}
      VOLUME_SMTP_PASSWORD: ${VOLUME_SMTP_PASSWORD:-}
      VOLUME_SMTP_FROM: ${VOLUME_SMTP_FROM:-}
      VOLUME_SMTP_STARTTLS: ${VOLUME_SMTP_STARTTLS:-true}
      VOLUME_SMTP_SSL: ${VOLUME_SMTP_SSL:-false}
      VOLUME_PUBLIC_BASE_URL: ${VOLUME_PUBLIC_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  pgbackup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-fair_price}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${MOEX_FRONTEND_BIND:-0.0.0.0}:${MOEX_FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.4
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=http://junibox/prometheus/"
      - "--web.route-prefix=/prometheus"
    ports:
      - "${MOEX_OBSERVABILITY_BIND:-127.0.0.1}:${MOEX_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.5
    environment:
      GF_SERVER_ROOT_URL: http://junibox/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards-json/moex-home-and-app-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${MOEX_OBSERVABILITY_BIND:-127.0.0.1}:${MOEX_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yml:ro
    ports:
      - "${MOEX_OBSERVABILITY_BIND:-127.0.0.1}:${MOEX_LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

volumes:
  postgres_data:

# Мониторинг включён по умолчанию и запускается вместе с приложением.
