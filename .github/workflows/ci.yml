name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Pytest
        run: PYTHONPATH=backend pytest -q backend/tests

  frontend-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/volumes/volumes.js
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Validate Compose file
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend-and-scripts, browser]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t moex-backend:ci backend
      - name: Build frontend image
        run: docker build -t moex-frontend:ci frontend
