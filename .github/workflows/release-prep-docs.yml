name: Release prep docs

on:
  push:
    branches: [release-v0.1.0]

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.1.0
      - name: Update README for full-year dividends and Arsagera worker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "Приложение хранит прогнозы чистой прибыли и оставшихся дивидендов, получает текущие котировки через MOEX ISS и считает ожидаемую полную доходность от текущей цены.":
                  "Приложение хранит прогнозы чистой прибыли и полные годовые прогнозы дивидендов, получает текущие котировки через MOEX ISS и считает ожидаемую полную доходность от текущей цены.",
              "- оставшиеся дивиденды к выплате в рублях на акцию;":
                  "- полный прогноз дивидендов за календарный год в рублях на акцию;",
              "Если таблица вручную сдвинута вперёд и отображает 2027/2028, доходность 2027 всё равно включает оставшиеся дивиденды 2026 и 2027, потому что точкой отсчёта остаётся текущий день.":
                  "Если таблица вручную сдвинута вперёд и отображает 2027/2028, доходность 2027 всё равно учитывает дивиденды 2026 и 2027, потому что точкой отсчёта остаётся текущий день. Для текущего календарного года backend автоматически вычитает уже прошедшие фактические выплаты по данным MOEX ISS.",
              "Поле `Остаток дивидендов к выплате` означает именно будущую сумму, которую инвестор ещё должен получить. После выплаты значение нужно уменьшить на выплаченную сумму. Если оставшихся выплат за год больше нет — установить `0`.":
                  "`dividend_year_map` хранит полный прогноз дивидендов за календарный год. Для текущего года backend отдельно получает уже прошедшие фактические выплаты из MOEX ISS и вычитает их при расчёте полной доходности. Вручную уменьшать годовой прогноз после каждой выплаты не требуется.",
              "Она включает только дивиденды выбранного года. Полная доходность учитывает изменение цены и все оставшиеся дивиденды от текущего дня до выбранного года.":
                  "Она включает только полный годовой прогноз дивидендов выбранного года. Полная доходность учитывает изменение цены и дивиденды, которые ещё предстоит получить от текущего дня до выбранного года.",
              "- `backend` — FastAPI + SQLAlchemy + Alembic;\n- `volume-worker` — планировщик и сборщик оборотов акций TQBR из MOEX ISS;":
                  "- `backend` — FastAPI + SQLAlchemy + Alembic;\n- `arsagera-worker` — синхронизация прогнозов чистой прибыли и дивидендов из опубликованной таблицы Арсагеры;\n- `volume-worker` — планировщик и сборщик оборотов акций TQBR из MOEX ISS;",
              "После первого запуска `volume-worker` загружает историю с MOEX. Накопленную БД старого `moex-vol` импортировать не требуется.":
                  "После первого запуска `volume-worker` загружает историю с MOEX. `arsagera-worker` при старте синхронизирует уже существующие тикеры таблицы аналитика `Арсагера`, затем повторяет синхронизацию каждые 6 часов по умолчанию. Накопленную БД старого `moex-vol` импортировать не требуется.",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"README fragment not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README for v0.1.0 release"
          git push origin HEAD:release-v0.1.0
