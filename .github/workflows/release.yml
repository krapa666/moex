name: Publish release

on:
  push:
    branches: [main]
    paths:
      - ".release/v*.md"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          notes_file="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -E '^\.release/v[0-9]+\.[0-9]+\.[0-9]+\.md$' \
            | head -n 1 || true)"
          if [ -z "$notes_file" ]; then
            echo "No release notes file found in commit $GITHUB_SHA" >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION is not valid SemVer: $version" >&2
            exit 1
          fi

          tag="$(basename "$notes_file" .md)"
          expected_tag="v$version"
          if [ "$tag" != "$expected_tag" ]; then
            echo "Release notes $tag do not match VERSION $version" >&2
            exit 1
          fi

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES_FILE: ${{ steps.meta.outputs.notes_file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "MOEX Fair Price $TAG" \
            --notes-file "$NOTES_FILE"
