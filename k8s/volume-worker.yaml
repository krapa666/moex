apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-worker
  namespace: moex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volume-worker
  template:
    metadata:
      labels:
        app: volume-worker
    spec:
      initContainers:
        - name: wait-for-backend-migrations
          image: krapa666/moex-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import time
              import urllib.request
              for _ in range(90):
                  try:
                      urllib.request.urlopen("http://backend:8000/api/health", timeout=3)
                      raise SystemExit(0)
                  except Exception:
                      time.sleep(2)
              raise SystemExit("backend did not become ready")
      containers:
        - name: volume-worker
          image: krapa666/moex-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.volume_worker"]
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: POSTGRES_PASSWORD
            - name: VOLUME_SCHEDULE_HOUR
              value: "18"
            - name: VOLUME_SCHEDULE_MINUTES
              value: "20,35,45"
            - name: VOLUME_SCHEDULE_TIMEZONE
              value: Europe/Moscow
            - name: VOLUME_RUN_ON_STARTUP
              value: "true"
            - name: VOLUME_BASELINE_SESSIONS
              value: "60"
            - name: VOLUME_DISPLAY_SESSIONS
              value: "60"
            - name: VOLUME_MIN_BASELINE_SESSIONS
              value: "60"
            - name: VOLUME_SIGNAL_MIN_RATIO
              value: "3.6"
            - name: VOLUME_SIGNAL_MAX_RATIO
              value: "6.5"
            - name: VOLUME_BROAD_MARKET_SIGNAL_THRESHOLD
              value: "10"
            - name: VOLUME_MOEX_HISTORY_ROWS
              value: "140"
            - name: VOLUME_SMTP_ENABLED
              value: "false"
            - name: VOLUME_SMTP_HOST
              value: ""
            - name: VOLUME_SMTP_PORT
              value: "587"
            - name: VOLUME_SMTP_FROM
              value: ""
            - name: VOLUME_PUBLIC_BASE_URL
              value: ""
            - name: VOLUME_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: VOLUME_SMTP_USERNAME
                  optional: true
            - name: VOLUME_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: VOLUME_SMTP_PASSWORD
                  optional: true
            - name: VOLUME_NOTIFICATION_EMAIL
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: VOLUME_NOTIFICATION_EMAIL
                  optional: true
