apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: moex
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: moex-backend
        metrics_path: /metrics
        static_configs:
          - targets: ['backend:8000']

      - job_name: moex-infra
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'prometheus:9090'
              - 'loki:3100'
  alerts.yml: |
    groups:
      - name: moex-backend-alerts
        rules:
          - alert: BackendDown
            expr: up{job="moex-backend"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "MOEX backend недоступен"
          - alert: MOEXVolumeCollectionFailed
            expr: moex_volume_collection_status{status="failed"} == 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Сбор объёмов акций TQBR завершился ошибкой"
          - alert: MOEXVolumeCollectionPartial
            expr: moex_volume_collection_status{status="partial"} == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Собраны не все объёмы акций TQBR"
          - alert: MOEXVolumeCollectionStale
            expr: (moex_volume_last_success_timestamp_seconds > 0) and (time() - moex_volume_last_success_timestamp_seconds > 345600)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Успешного сбора объёмов акций TQBR не было более 4 суток"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: moex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.external-url=http://junibox/prometheus/
            - --web.route-prefix=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/alerts.yml
              subPath: alerts.yml
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: moex
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
