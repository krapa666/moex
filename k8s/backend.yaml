apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: moex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: krapa666/moex-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: POSTGRES_PASSWORD
            - name: VOLUME_SMTP_ENABLED
              value: "false"
            - name: VOLUME_SMTP_HOST
              value: ""
            - name: VOLUME_SMTP_PORT
              value: "587"
            - name: VOLUME_SMTP_FROM
              value: ""
            - name: VOLUME_PUBLIC_BASE_URL
              value: ""
            - name: VOLUME_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: VOLUME_SMTP_USERNAME
                  optional: true
            - name: VOLUME_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: VOLUME_SMTP_PASSWORD
                  optional: true
            - name: VOLUME_NOTIFICATION_EMAIL
              valueFrom:
                secretKeyRef:
                  name: moex-secrets
                  key: VOLUME_NOTIFICATION_EMAIL
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: moex
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
