# HTTP reverse-proxy template for the Minikube deployment.
# Generated by scripts/configure-nginx-k8s-proxy.sh.

upstream moex_minikube_frontend {
    server MINIKUBE_FRONTEND_ENDPOINT;
}

server {
    listen 80;
    server_name SERVER_NAMES_PLACEHOLDER;

    client_max_body_size 20m;
    keepalive_timeout 65;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $moex_access_scope "internet";
    if ($remote_addr ~ "^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)") {
        set $moex_access_scope "local";
    }
    if ($remote_addr = "::1") {
        set $moex_access_scope "local";
    }

    location / {
        proxy_pass http://moex_minikube_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Moex-Access-Scope $moex_access_scope;
    }
}
