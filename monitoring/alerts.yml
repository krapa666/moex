groups:
  - name: moex-backend-alerts
    rules:
      - alert: BackendDown
        expr: up{job="moex-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MOEX backend недоступен"
          description: "Prometheus не может получить /metrics у backend более 2 минут"

      - alert: BackendHighErrorRate
        expr: rate(http_requests_total{job="moex-backend",status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Повышенная доля 5xx ошибок backend"
          description: "Проверь логи backend и доступность MOEX"

  - name: moex-volume-monitor-alerts
    rules:
      - alert: MOEXVolumeCollectionFailed
        expr: moex_volume_collection_status{status="failed"} == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Сбор объёмов акций TQBR завершился ошибкой"
          description: "Последний запуск volume-worker не смог завершить сбор. Проверь docker compose logs volume-worker."

      - alert: MOEXVolumeCollectionPartial
        expr: moex_volume_collection_status{status="partial"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Собраны не все объёмы акций TQBR"
          description: "Последний запуск обновил только часть бумаг. Возможна частичная недоступность MOEX ISS."

      - alert: MOEXVolumeCollectionStale
        expr: (moex_volume_last_success_timestamp_seconds > 0) and (time() - moex_volume_last_success_timestamp_seconds > 345600)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Успешного сбора объёмов акций TQBR не было более 4 суток"
          description: "Порог 4 суток выбран с запасом на выходные; в длинные биржевые праздники предупреждение может быть ожидаемым."
